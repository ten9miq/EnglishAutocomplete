[General]
Enabled=1
MinLength=2
MaxCandidates=9
InitialCandidates=5
FontSize=11
OffsetX=0
OffsetY=24
ShowTranslation=1
Learning=1
PromotionCount=2
SCOWL=1
EJDict=1
; IT adds CSpell terms/tools; AI supplement also requires IT=1.
IT=1
; IT base score=1000. Larger boosts put IT words earlier (-5000..5000).
ITScoreBoost=1200
AISupplement=1
; Additional boost for the independently curated AI product names.
AIScoreBoost=300
Debug=0
CaretMode=Win32
DebounceMs=30
DataDirectory=user

[Keys]
Accept=^!Space
Next=Tab
Previous=^!Up
Cancel=Esc
DirectModifier=^!
Tab=0
Enter=0
ImeStyle=1

; All applications can complete/learn in verified safe fields, independent of exe name.
; Both learning and completion require a supported, editable, non-password field.
[Applications]
DefaultEnabled=1
DefaultLearning=1
Excluded=keepass.exe,keepassxc.exe,1password.exe,bitwarden.exe,credentialuibroker.exe,mstsc.exe

[app:notepad.exe]
Enabled=1
Learning=1
Keys=1
